apiVersion: apps/v1
kind: Deployment
metadata:
  name: napcat
  labels:
    app: napcat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: napcat
  template:
    metadata:
      labels:
        app: napcat
    spec:
      containers:
      - name: napcat
        image: mlikiowa/napcat-docker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: port-3000
          containerPort: 3000
        - name: port-3001
          containerPort: 3001
        - name: port-6099
          containerPort: 6099
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /webui
            port: 6099
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /webui
            port: 6099
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: napcat-data
          mountPath: /app/.config/QQ
          subPath: QQ
        - name: napcat-data
          mountPath: /app/napcat/config
          subPath: config
      volumes:
      - name: napcat-data
        persistentVolumeClaim:
          claimName: napcat-data-pvc