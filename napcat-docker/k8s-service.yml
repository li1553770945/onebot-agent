apiVersion: v1
kind: Service
metadata:
  name: napcat
  labels:
    app: napcat
spec:
  type: NodePort
  selector:
    app: napcat
  ports:
  - name: http-3000
    port: 3000
    targetPort: 3000
    nodePort: 30000  # 可选，范围通常 30000-32767；或删除 nodePort 让 k8s 分配
  - name: http-3001
    port: 3001
    targetPort: 3001
    nodePort: 30001
  - name: tcp-6099
    port: 6099
    targetPort: 6099
    nodePort: 30099