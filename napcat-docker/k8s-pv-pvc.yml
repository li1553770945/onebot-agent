---
# PersistentVolume for napcat data
apiVersion: v1
kind: PersistentVolume
metadata:
  name: napcat-data-pv
spec:
  capacity:
    storage: 11Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: ${NAPCAT_DATA_PATH}
    type: Directory

---
# PersistentVolumeClaim for napcat data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: napcat-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 11Gi
